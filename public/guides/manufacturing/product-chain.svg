<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#92b9f7" stroke-width="1.5"/></marker></defs><rect width="1120" height="520" rx="24" fill="#f5f9ff"/><text x="38" y="48" fill="#075bff" font-size="13" font-weight="700" font-family="Arial, sans-serif">ATLAS  /  MANUFACTURING &amp; SUPPLY</text><text x="38" y="90" fill="#172943" font-size="30" font-weight="700" font-family="Arial, sans-serif">Materials and finished goods belong together.</text><text x="38" y="124" fill="#7b879e" font-size="16" font-weight="400" font-family="Arial, sans-serif">Sales eligibility is separate from the item class and how you obtain supply.</text><rect x="38" y="170" width="250" height="112" rx="20" fill="#fff" stroke="#dae6f7"/><circle cx="66" cy="200" r="15" fill="#eaf3ff"/><text x="61" y="206" fill="#075bff" font-size="16" font-weight="700" font-family="Arial, sans-serif">1</text><text x="60" y="235" fill="#172943" font-size="20" font-weight="700" font-family="Arial, sans-serif">Raw material</text><text x="60" y="262" fill="#7b879e" font-size="14" font-weight="400" font-family="Arial, sans-serif">Active - not sellable</text><rect x="38" y="308" width="250" height="112" rx="20" fill="#fff" stroke="#dae6f7"/><circle cx="66" cy="338" r="15" fill="#eaf3ff"/><text x="61" y="344" fill="#075bff" font-size="16" font-weight="700" font-family="Arial, sans-serif">2</text><text x="60" y="373" fill="#172943" font-size="20" font-weight="700" font-family="Arial, sans-serif">Packaging</text><text x="60" y="400" fill="#7b879e" font-size="14" font-weight="400" font-family="Arial, sans-serif">Active - not sellable</text><rect x="397" y="232" width="310" height="116" rx="20" fill="#fff" stroke="#dae6f7"/><circle cx="425" cy="262" r="15" fill="#eaf3ff"/><text x="420" y="268" fill="#075bff" font-size="16" font-weight="700" font-family="Arial, sans-serif">3</text><text x="419" y="297" fill="#172943" font-size="20" font-weight="700" font-family="Arial, sans-serif">Intermediate / WIP</text><text x="419" y="324" fill="#7b879e" font-size="14" font-weight="400" font-family="Arial, sans-serif">Made here - not sellable</text><rect x="812" y="232" width="270" height="116" rx="20" fill="#fff" stroke="#dae6f7"/><circle cx="840" cy="262" r="15" fill="#eaf3ff"/><text x="835" y="268" fill="#075bff" font-size="16" font-weight="700" font-family="Arial, sans-serif">4</text><text x="834" y="297" fill="#172943" font-size="20" font-weight="700" font-family="Arial, sans-serif">Finished product</text><text x="834" y="324" fill="#7b879e" font-size="14" font-weight="400" font-family="Arial, sans-serif">Made here - sellable</text><path d="M294 224 L390 286" fill="none" stroke="#92b9f7" stroke-width="3" marker-end="url(#arrow)"/><path d="M294 362 L390 299" fill="none" stroke="#92b9f7" stroke-width="3" marker-end="url(#arrow)"/><path d="M713 290 L805 290" fill="none" stroke="#92b9f7" stroke-width="3" marker-end="url(#arrow)"/><text x="395" y="397" fill="#344563" font-size="15" font-weight="500" font-family="Arial, sans-serif">All items use the same Product identity, stock unit and Inventory records.</text><text x="38" y="492" fill="#7b879e" font-size="13" font-weight="400" font-family="Arial, sans-serif">Illustrated workflow - follow the working instructions and your authorised Atlas records.</text></svg>